; 5Star production overrides (loaded after php.ini-production)

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Product images are capped at 5 MB by the app (UPLOAD_MAX_IMAGE_BYTES);
; CSV/Excel imports and database-backup restores can be larger.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 512M
max_execution_time = 120

date.timezone = Asia/Kolkata

session.cookie_secure = On
session.cookie_httponly = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

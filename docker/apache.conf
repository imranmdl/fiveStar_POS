# 5Star — one virtual host, three areas:
#   /api      PHP REST API (front controller)
#   /uploads  user-uploaded images (persistent volume, never executed)
#   /         React single-page app (storefront, /admin, /till)
#
# Listen port comes from $PORT (Railway sets it); see entrypoint.

<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/web

    # Railway terminates TLS at its edge and forwards plain HTTP. Tell PHP the
    # original request was https so generated links and cookies are correct.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Keep tokens and request bodies out of the access log; Railway collects
    # stdout/stderr.
    ErrorLog /dev/stderr
    LogFormat "%{X-Forwarded-For}i %l %u %t \"%m %U\" %>s %b %D \"%{User-Agent}i\"" railway
    CustomLog /dev/stdout railway

    # ------------------------------------------------------------------
    # API: every /api/... request runs the backend's front controller.
    # Aliasing to the FILE keeps SCRIPT_NAME at "/api", so Request.php's
    # sub-directory stripping is a no-op and the router sees /api/v1/....
    # ------------------------------------------------------------------
    Alias /api /var/www/app/backend/public/index.php
    <Directory /var/www/app/backend/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        AcceptPathInfo On
        # Apache withholds the Authorization header from PHP by default; the
        # JWT bearer token travels in it. (backend/public/.htaccess does the
        # same on shared hosting, but .htaccess is not read here.)
        CGIPassAuth On
    </Directory>

    # OpenAPI / Swagger viewer shipped with the backend.
    Alias /api-docs /var/www/app/backend/public/docs
    <Directory /var/www/app/backend/public/docs>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # Uploads: static files only. PHP must never run from here.
    # ------------------------------------------------------------------
    Alias /uploads /var/www/app/backend/public/uploads
    <Directory /var/www/app/backend/public/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource disabled
        php_admin_flag engine off
        <FilesMatch "\.(php\d?|phtml|phar|pht|shtml|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>

    # ------------------------------------------------------------------
    # SPA: real files are served as-is, every other path gets index.html
    # so React Router can handle /admin/..., /till, /product/... directly.
    # ------------------------------------------------------------------
    <Directory /var/www/web>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>

    # Hashed build assets never change: cache for a year.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The app shell and service worker must always be revalidated, or users
    # keep running an old build after a deploy.
    <LocationMatch "^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # Never let anything outside these trees be read.
    <Directory /var/www/app>
        Require all denied
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
    Header always unset X-Powered-By

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</VirtualHost>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spice &amp; Dry Fruits — whole spices, ground fresh</title>
  <meta name="description" content="Whole spices, dry fruits, herbs and seeds. Sourced directly, ground fresh, delivered across India.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/store.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B3B2E">
  <link rel="apple-touch-icon" href="assets/img/icon.svg">
</head>
<body>
  <div data-chrome="header"></div>

  <main class="container py-4">
    <!-- The main headline: live promotional offers, one at a time. See
         assets/js/offer-hero.js — collapses to nothing when no offer is live. -->
    <div data-offer-hero></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
      <div>
        <h1 class="h4 mb-1" data-results-heading>Everything</h1>
        <p class="text-muted small mb-0" data-results-count></p>
      </div>

      <div class="d-flex gap-2">
        <label class="visually-hidden" for="sort">Sort</label>
        <select class="form-select form-select-sm w-auto" id="sort" data-sort>
          <option value="">Sort: featured</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="rating">Best rated</option>
        </select>
      </div>
    </div>

    <!-- Answered before being asked: these are the three questions every Indian
         shopper has about a food shop they have not used before. -->
    <!-- The design leads with dispatch, packing and the delivery threshold.
         Those are the three things a dry-fruit buyer wants answered, and the
         prepaid-UPI rule belongs with them because it is unusual enough to
         surprise someone at checkout. -->
    <div class="trust-strip">
      <span><b>Same-day dispatch</b> on orders before 2pm</span>
      <span><b>Nitrogen-flushed packs</b> — sealed for freshness</span>
      <span><b>Free delivery</b> over ₹999</span>
      <span><b>Prepaid UPI</b> · prices include GST</span>
    </div>

    <!-- Advert slots. Empty unless something is live, and filled only after the
         products have loaded — an advert must never delay the shop. -->
    <div data-banner-hero></div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3" data-products></div>

    <div data-banner-strip class="mt-4"></div>

    <!-- Festive gift collections (Ganesh Chaturthi, Eid, ...) plus a small
         link into full corporate/bulk gifting. See assets/js/gift-collections.js
         — collapses to nothing when no campaign page is live. -->
    <section class="mt-4" data-gift-collections aria-label="Festive gifting"></section>

    <nav class="mt-4" data-pagination></nav>

    <!-- Rate us (5 stars) and get help. Filled in by assets/js/home-feedback.js;
         reviews land in the admin Reviews page, messages in Support. -->
    <section class="mt-5" data-home-feedback aria-label="Reviews and support"></section>

    <!-- Hidden on the page but kept so search from the header still resolves. -->
    <form class="d-none" data-search-form><input id="search" name="q"></form>
    <div class="d-none" data-categories></div>
  </main>

  <div data-chrome="footer"></div>

  <script src="assets/js/env.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/page-catalog.js"></script>
  <script type="module" src="assets/js/home-feedback.js"></script>
</body>
</html>
